name: daily-update

on:
  schedule:
    # UTC 12:00 = KST 21:00
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect FreeSIS data
        run: python src/collect_freesis.py

      - name: Build dashboard data.json
        run: python src/build_dashboard_data.py

      - name: Commit changes if any
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/assets/data.json
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: daily update $(date -u +'%Y-%m-%d')"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Evaluate alert conditions
        id: alert
        run: python src/check_alerts.py
        env:
          SITE_URL: https://kospi-analysis.pages.dev/

      - name: Send email (only if alert triggered)
        if: steps.alert.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASS }}
          subject: "[KOSPI 알림] ${{ steps.alert.outputs.title }} - ${{ steps.alert.outputs.date_str }}"
          to:    ${{ secrets.MAIL_TO }}
          from:  ${{ secrets.MAIL_FROM != '' && secrets.MAIL_FROM || secrets.SMTP_USER }}
          body:  ${{ steps.alert.outputs.body }}
          convert_markdown: false
